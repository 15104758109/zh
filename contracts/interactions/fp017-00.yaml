version: 1
contract_id: FP017-00
owner: F0-04-LOCAL-OPERATOR
object_scope:
  local_operator_id: required
  book_id: optional
actions:
  - id: first_bootstrap_create
    prerequisites:
      - local_installation
    backend_command:
      registry_id: INTERNAL-F0-04
      command_id: load_or_create_local_operator
    success:
      result: local_operator_created
      state_change: true
    failure:
      code: LOCAL_OPERATOR_BOOTSTRAP_FAILED
      message: Retry local bootstrap.
    recovery:
      strategy: retry
    permission:
      source: not_applicable
      enforcement: backend
    projection:
      mode: readonly
      fields:
        - local_operator_id
  - id: restart_load
    prerequisites:
      - local_installation
    backend_command:
      registry_id: INTERNAL-F0-04
      command_id: load_or_create_local_operator
    success:
      result: local_operator_loaded
      state_change: false
    failure:
      code: LOCAL_OPERATOR_BOOTSTRAP_FAILED
      message: Retry local bootstrap.
    recovery:
      strategy: retry
    permission:
      source: not_applicable
      enforcement: backend
    projection:
      mode: readonly
      fields:
        - local_operator_id
  - id: bootstrap_failure_retry_recovery
    prerequisites:
      - local_installation
    backend_command:
      registry_id: INTERNAL-F0-04
      command_id: load_or_create_local_operator
    success:
      result: local_operator_recovered
      state_change: true
    failure:
      code: LOCAL_OPERATOR_BOOTSTRAP_FAILED
      message: Retry local bootstrap.
    recovery:
      strategy: retry
    permission:
      source: not_applicable
      enforcement: backend
    projection:
      mode: readonly
      fields:
        - local_operator_id
  - id: scope_shape_invalid
    prerequisites:
      - local_operator_loaded
    backend_command:
      registry_id: INTERNAL-F0-04
      command_id: assert_object_scope
    success:
      result: object_scope_valid
      state_change: false
    failure:
      code: LOCAL_OPERATOR_SCOPE_INVALID
      message: Correct the object scope.
    recovery:
      strategy: correct_input
    permission:
      source: not_applicable
      enforcement: backend
    projection:
      mode: readonly
      fields:
        - local_operator_id
  - id: scope_mismatch
    prerequisites:
      - local_operator_loaded
    backend_command:
      registry_id: INTERNAL-F0-04
      command_id: assert_object_scope
    success:
      result: object_scope_matches
      state_change: false
    failure:
      code: LOCAL_OPERATOR_SCOPE_MISMATCH
      message: Use the matching object scope.
    recovery:
      strategy: correct_input
    permission:
      source: not_applicable
      enforcement: backend
    projection:
      mode: readonly
      fields:
        - local_operator_id
