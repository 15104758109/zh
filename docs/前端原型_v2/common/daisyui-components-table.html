const catalog=document.getElementById('catalog');
const filter=document.getElementById('filter');
function render(){catalog.innerHTML='';sections.forEach(section=>{const head=document.createElement('div');head.className='demo-section-head';head.innerHTML=`<h2>${section.title}</h2><span>${section.zh} / ${section.items.length}</span>`;catalog.appendChild(head);section.items.forEach(([ref,zh,html,variant=''])=>{const card=document.createElement('article');card.className='demo-component';card.dataset.search=`${section.title} ${section.zh} ${ref} ${zh}`.toLowerCase();card.innerHTML=`<div class="demo-preview ${variant}">${html}</div><div class="demo-meta"><code title="${ref}">${ref}</code><span>${zh}</span></div>`;catalog.appendChild(card)})})}
function setExclusive(prefix,next){document.body.className=document.body.className.split(/\s+/).filter(c=>!c.startsWith(prefix)).concat(next).join(' ')}
function applyFilter(){const q=filter.value.trim().toLowerCase();document.querySelectorAll('.demo-component').forEach(card=>card.classList.toggle('is-hidden',q&&!card.dataset.search.includes(q)));document.querySelectorAll('.demo-section-head').forEach(head=>{let node=head.nextElementSibling,visible=false;while(node&&!node.classList.contains('demo-section-head')){if(!node.classList.contains('is-hidden'))visible=true;node=node.nextElementSibling}head.style.display=visible||!q?'':'none'})}
render();filter.addEventListener('input',applyFilter);
document.addEventListener('click',event=>{const control=event.target.closest('[data-control] button');if(control){const group=control.closest('[data-control]');group.querySelectorAll('button').forEach(button=>button.classList.toggle('active',button===control));setExclusive(group.dataset.control+'-',control.dataset.value)}const theme=event.target.closest('.demo-palette button[data-theme-class]');if(theme){document.querySelectorAll('.demo-palette button[data-theme-class]').forEach(button=>button.classList.toggle('active',button===theme));setExclusive('theme-',theme.dataset.themeClass)}const modal=event.target.closest('[data-action="modal"]');if(modal)document.getElementById('sampleModal').showModal()});
document.getElementById('resetBtn').addEventListener('click',()=>{document.body.className='size-md font-system theme-base';filter.value='';document.querySelectorAll('.demo-tabs').forEach(group=>group.querySelectorAll('button').forEach((button,index)=>button.classList.toggle('active',index===0)));document.querySelectorAll('.demo-palette button[data-theme-class]').forEach((button,index)=>button.classList.toggle('active',index===0));applyFilter()});
</script>
