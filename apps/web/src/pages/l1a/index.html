<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        .glass-panel {
            background: rgba(20, 27, 38, 0.6);
            backdrop-3: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #32353c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #424754;
        }


        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-2px) scale(1.05); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        /* Quick Settings Popover */
        .quick-settings-glass {
            background: var(--color-base-100, rgba(15, 18, 25, 0.9)) !important;
            backdrop-3: blur(20px);
            -webkit-backdrop-3: blur(20px);
            border: 1px solid var(--color-border, rgba(255, 255, 255, 0.1)) !important;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        /* Custom Toggle Switch */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 12px; width: 12px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider { background-color: rgba(77, 142, 255, 0.3); border-color: rgba(77, 142, 255, 0.4); }
        input:checked + .toggle-slider:before { transform: translateX(16px); background-color: #4d8eff; }

        .custom-range {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
        }
        .custom-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: #4d8eff;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
        }

        .glass-effect {
            background: rgba(21, 25, 33, 0.7);
            backdrop-3: blur(12px);
            -webkit-backdrop-3: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        @keyframes toast-progress {
            from { width: 100%; }
            to { width: 0%; }
        }
        /* Toast 专属样式 */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .toast-item {
            width: 320px;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 22, 33, 0.85);
            backdrop-3: blur(20px);
            -webkit-backdrop-3: blur(20px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5), 0 8px 10px -6px rgb(0 0 0 / 0.5);
            display: flex;
            gap: 12px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateX(360px);
            opacity: 0;
        }
        .toast-item.toast-show {
            transform: translateX(0);
            opacity: 1;
        }
        .toast-success {
            border-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
            background: rgba(16, 185, 129, 0.06);
        }
        .toast-info {
            border-color: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            background: rgba(59, 130, 246, 0.06);
        }
        .toast-warning {
            border-color: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.06);
        }
        .toast-error {
            border-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            background: rgba(239, 68, 68, 0.06);
        }
            /* 顶栏随侧栏折叠隐藏 */
        .header-glass { transition: left .2s ease, transform .2s ease, opacity .2s ease; }
        body.sidebar-collapsed .header-glass { transform: translateX(-120%); opacity: 0; pointer-events: none; }
        .header-tabs { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: var(--color-neutral); }
        .header-tab { display: inline-flex; align-items: center; justify-content: center; height: 22px; padding: 0 10px; border-radius: 8px; font-size: 11px; font-weight: 600; line-height: 1; text-decoration: none; white-space: nowrap; color: var(--color-neutral-content); opacity: 0.6; transition: all 0.15s ease; cursor: pointer; }
        .header-tab:hover { opacity: 0.85; }
        .header-tab.active { opacity: 1; background: var(--color-base-300); color: var(--color-base-content); }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
</style>

<body class="ui-page bg-base-200 text-base-content font-body-md overflow-hidden flex h-screen selection:bg-primary/30 selection:text-base-content">

    <header class="header-glass h-16 fixed top-0 right-0 z-[60] flex justify-between items-center px-6 bg-base-100">
        <div class="flex items-center gap-4 h-full">
            <nav class="flex h-full items-center ml-2">
                <!-- Outer capsule badge-outline container with spacing inside and expanded black inner shadow -->
                                <div class="header-tabs">

                </div>
            </nav>
        </div>
        <div class="flex items-center gap-3">
            <!-- 当前书籍标识 -->

            </button>

            <!-- 快捷设置齿轮与弹窗 -->
            <div class="relative flex items-center">

                    <span class="material-symbols-outlined text-[20px]">settings</span>

                <!-- Quick Settings Popover -->
                        <div id="quick-settings-popover" class="hidden absolute top-12 right-0 w-64 rounded-box border bg-base-100 shadow-2xl p-4 z-50 border-base-content/10 transition-all duration-300">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-[11px] font-bold text-base-content tracking-widest uppercase opacity-90">快速控制</span>

                        <div id="sw-auto-production" class="settings-switch" onclick="toggleAutoSwitch('auto_production', this)" data-key="auto_production"></div>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] text-base-content font-medium opacity-80">审计阶段自动化</span>

                    </div>
                    <div class="flex items-center justify-between">

                    </div>
                </div>
                <div class="mt-3 pt-2 border-t border-base-content/5">
                    <button class="settings-btn w-full" onclick="document.getElementById('quick-settings-popover').classList.add('hidden')">
                        <span class="material-symbols-outlined text-[14px]">check</span>
                        应用当前配置
                    </button>
                </div>
            </div>

            <div class="h-8 w-[1px] bg-base-content/5 mx-1"></div>

        </div>

<main id="main-content" class="main-content pt-16 w-full h-screen flex flex-col bg-base-200 relative overflow-hidden transition-all shadow-sm border border-base-content/5">
